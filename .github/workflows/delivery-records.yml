name: Delivery records

# When a delivery pull request is merged, send the issue's work records to DriftShield.
# Only merged pull requests from a branch of this same repository (auto/<owner>-<repo>/issue-N-rK).
# Forks never reach it, and no privileged trigger is used. A repository that is not set up yet
# (no secret, variable or profile list) skips with a line in the step summary and stays green.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  records:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.event.pull_request.head.ref, 'auto/') || startsWith(github.event.pull_request.head.ref, 'fm/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
          sparse-checkout: .claude
      - name: Send records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFTSHIELD_API_KEY: ${{ secrets.DRIFTSHIELD_API_KEY }}
          DS_REVIEW_PRODUCER: ${{ vars.DS_REVIEW_PRODUCER }}
          DS_REVIEWER_LOGINS: ${{ vars.DS_REVIEWER_LOGINS }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .claude/hooks/records.py --pull "$PULL_NUMBER"
